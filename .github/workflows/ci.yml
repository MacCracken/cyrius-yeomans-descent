name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml gates on this workflow via `uses: ./.github/workflows/ci.yml`.
  # GitHub Actions requires the called workflow to opt in via `workflow_call:`
  # — without this, the release-tag run trips on the CI-gate step.
  # Same pattern as agora 1.0.0's CI.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of truth
          # for the toolchain version — no version hardcoded here. Read the pin
          # and hand it to the UPSTREAM installer, which fetches + lays out
          # $HOME/.cyrius/{bin,lib} in the versioned layout `cyrius deps` expects.
          # (The old hand-rolled `cp -r lib/*` flattened the stdlib so `cyrius
          # deps` couldn't find it — "dep X requires 'Y' … not in the cyrius stdlib".)
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # Cyrius 6.0.1: bare `cyrius test` is unreliable in CI — the
        # released-tarball toolchain exits with "No .tcyr files found
        # in tests/tcyr/ or tests/" even when tests/*.tcyr is present
        # (different code path from the locally-installed cyrius).
        # Agora 1.0.0's CI hit the same issue at the same version
        # (`docs/development/roadmap.md` notes the explicit form is
        # known-good at 6.0.1). Pass the [build].test entry explicitly;
        # tests/cyrius-yeomans-descent.tcyr stays as the auto-discovered
        # secondary suite when bare `cyrius test` is invoked locally.
        run: cyrius test src/test.cyr
