name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml gates on this workflow via `uses: ./.github/workflows/ci.yml`.
  # GitHub Actions requires the called workflow to opt in via `workflow_call:`
  # — without this, the release-tag run trips on the CI-gate step.
  # Same pattern as agora 1.0.0's CI.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of truth
          # for the toolchain version — no version hardcoded here. Read the pin
          # and hand it to the UPSTREAM installer, which fetches + lays out
          # $HOME/.cyrius/{bin,lib} in the versioned layout `cyrius deps` expects.
          # (The old hand-rolled `cp -r lib/*` flattened the stdlib so `cyrius
          # deps` couldn't find it — "dep X requires 'Y' … not in the cyrius stdlib".)
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Build (AGNOS target)
        # 1.7.8 — THE CAUSE, not the instance.
        #
        # `--agnos` was never built here, and that is the whole reason a defect of
        # this size lived in the tree: on AGNOS, syscall 82 is GPU dispatch and 87
        # is a GPU blit, not rename and unlink, and `sys_mkdir` takes a PATH LENGTH
        # where Linux takes a MODE. `player_save` used the raw numbers and the
        # Linux argument order, so on that target **no player record was ever
        # published and every reconnect was offered a brand-new character** — while
        # the x86_64 suite stayed green, because there 82/87 genuinely ARE rename
        # and unlink.
        #
        # A compile is not proof the target works — nothing here executes the AGNOS
        # binary. What it does buy is the thing that was actually missing: a
        # signature change in a `#ifdef CYRIUS_TARGET_AGNOS` branch now BREAKS THE
        # BUILD instead of rotting silently until someone runs the server.
        run: cyrius build src/main.cyr build/${{ github.event.repository.name }}-agnos --agnos

      - name: Test
        # MUST be bare `cyrius test`. The old step was `cyrius test src/test.cyr`,
        # and `src/test.cyr` is a deliberate no-op stub (`fn main() { return 0; }`)
        # that exists only to satisfy `[build].test` — so CI compiled a stub, exited
        # 0, and **the 298-assertion suite never ran here at all**. Every green run
        # before 1.2.0 said nothing about the tests.
        #
        # The workaround it came from was real but is long stale: at cyrius 6.0.1
        # the released-tarball toolchain couldn't find tests/*.tcyr ("No .tcyr files
        # found in tests/tcyr/ or tests/"). 6.4.72's corpus walker recurses tests/,
        # and bare `cyrius test` at the pinned 6.4.83 runs BOTH the .tcyr corpus and
        # [build].test — verified locally: "298 passed, 0 failed" + "1 passed, 0 failed".
        run: cyrius test

      - name: Audit
        # Project sweep — fmt / lint / docs / tests / bench over src + programs.
        # Green as of 1.2.0 and listed as a release gate in CLAUDE.md. NOTE: this
        # is `cyrius audit`, NOT `cyrius audit --internal` (the cyrius-compiler
        # self-host gate, which does not apply to this repo).
        run: cyrius audit
